<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Dalil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- One font per script. The browser only downloads the ones the page actually shows. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="topbar">
    <a class="brand" href="#scan" aria-label="Dalil home" data-i18n-aria="brand_home">
      <span class="brand-mark" aria-hidden="true">د</span>
      <span class="brand-name" dir="ltr"><span lang="en">Dalil</span> <span lang="ar">دليل</span></span>
    </a>
    <div class="topbar-actions">
      <!-- Interface language (issue #16): options come from LANGUAGES in web/js/i18n.js -->
      <div class="lang-picker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.2-3.4-8.5s1.1-6.1 3.4-8.5z"/></svg>
        <label class="visually-hidden" for="ui-lang" data-i18n="ui_language">Language</label>
        <select id="ui-lang"></select>
      </div>
      <button class="account-btn" id="account-btn" type="button" aria-label="Sign in"></button>
    </div>
  </header>

  <!-- Account sheet: web/js/account.js -->
  <dialog class="account-sheet" id="account-dialog"></dialog>

  <!-- Floating glass tab bar. Each tab is a <section> below. -->
  <nav class="tabs" aria-label="Main" data-i18n-aria="nav_main">
    <span class="tab-indicator" aria-hidden="true"></span>
    <a href="#scan" data-tab="scan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a2 2 0 0 1 2-2h1.7l1.4-2h5.8l1.4 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13.2" r="3.4"/></svg>
      <span data-i18n="tab_scan">Scan</span>
    </a>
    <a href="#deadlines" data-tab="deadlines">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5a2.5 2.5 0 0 1 2.5-2.5h3.6l2 2H18a2.5 2.5 0 0 1 2.5 2.5V17a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 17z"/><path d="M3.5 10.5h17"/></svg>
      <span data-i18n="tab_deadlines">My deadlines</span>
    </a>
    <a href="#services" data-tab="services">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="17" rx="3"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/></svg>
      <span data-i18n="tab_services">Services</span>
    </a>
    <a href="#how" data-tab="how">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.4"/></svg>
      <span data-i18n="tab_how">How it works</span>
    </a>
  </nav>

  <main id="main">
    <!-- Scan: web/js/scan.js (issue #12) -->
    <section id="tab-scan" class="tab-panel" aria-labelledby="scan-title"></section>

    <!-- My documents: web/js/deadlines.js (issue #13, synced with accounts) -->
    <section id="tab-deadlines" class="tab-panel" hidden></section>

    <!-- Services: web/js/services.js (issue #14) -->
    <section id="tab-services" class="tab-panel" hidden></section>

    <!-- How it works: web/js/how.js (issue #15) -->
    <section id="tab-how" class="tab-panel" hidden></section>
  </main>

  <script type="module" src="/web/js/app.js"></script>
</body>
</html>
