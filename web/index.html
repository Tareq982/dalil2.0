<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13294B">
<title>Dalil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#scan" aria-label="Dalil home">
      <span class="brand-mark" aria-hidden="true">د</span>
      <span class="brand-name">Dalil <span lang="ar">دليل</span></span>
    </a>
    <!-- Interface language picker goes here (issue #16) -->
  </header>

  <!-- Tab bar: bottom on phones, top on laptops. Each tab is a <section> below. -->
  <nav class="tabs" aria-label="Main">
    <a href="#scan" data-tab="scan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span data-i18n="tab_scan">Scan</span>
    </a>
    <a href="#deadlines" data-tab="deadlines">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span data-i18n="tab_deadlines">My deadlines</span>
    </a>
    <a href="#services" data-tab="services">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
      <span data-i18n="tab_services">Services</span>
    </a>
    <a href="#how" data-tab="how">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v6M12 7.5v.5"/></svg>
      <span data-i18n="tab_how">How it works</span>
    </a>
  </nav>

  <main id="main">
    <!-- Scan: web/js/scan.js (issue #12) -->
    <section id="tab-scan" class="tab-panel" aria-labelledby="scan-title"></section>

    <!-- My deadlines: web/js/deadlines.js (issue #13) -->
    <section id="tab-deadlines" class="tab-panel" hidden></section>

    <!-- Services: web/js/services.js (issue #14) -->
    <section id="tab-services" class="tab-panel" hidden></section>

    <!-- How it works: web/js/how.js (issue #15) -->
    <section id="tab-how" class="tab-panel" hidden></section>
  </main>

  <script type="module" src="/web/js/app.js"></script>
</body>
</html>
